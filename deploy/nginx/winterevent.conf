# nginx-Konfiguration für die Winterevent-Website (reine statische Dateien, kein Node.js)
#
# Installation: siehe deploy/README.md
#   1. Datei nach /etc/nginx/sites-available/winterevent.conf kopieren
#   2. "winterevent.enchantedhawks.eu" durch deine Subdomain ersetzen
#   3. HTTPS mit certbot einrichten (Pflicht: die Verschlüsselung im Browser läuft nur über https)

# Cache-Regeln: Bibliotheken lange cachen, eigene Dateien immer frisch prüfen,
# damit neue Codes (data.js) sofort bei allen ankommen.
map $uri $ehw_cache_control {
    default                         "no-cache";
    ~^/vendor/                      "public, max-age=2592000, immutable";
    ~*\.(?:webp|png|jpe?g|svg)$     "public, max-age=604800";
}

server {
    listen 80;
    listen [::]:80;
    server_name winterevent.enchantedhawks.eu;

    # Nur der Ordner docs/ ist öffentlich. config/, tools/ und .git liegen außerhalb.
    root /var/www/enchanted-hawks-winterevent/docs;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/winterevent.access.log;
    error_log  /var/log/nginx/winterevent.error.log warn;

    # Komprimierung (three.js schrumpft von ~690 KB auf ~170 KB)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Sicherheits-Header
    add_header Cache-Control $ehw_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "fullscreen=(self), camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Der sha256-Wert erlaubt genau die Import-Map in index.html. Ändert sich die Import-Map,
    # muss der Hash neu berechnet werden (Anleitung in deploy/README.md).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-47SYuv52ST9yQ76ncm8OHvWn4zem0EXrZt9l4WuC2XY='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # Versteckte Dateien (z. B. .git, .env) niemals ausliefern.
    # Ausnahme: /.well-known/ – darüber prüft Let's Encrypt (certbot) die Domain.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
