# Spiel-Server (PHP) für das Winterevent – wird per include in winterevent.conf eingebunden.
# Die PHP-Dateien liegen außerhalb von docs/ und sind von außen nicht abrufbar.
location = /api {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/enchanted-hawks-winterevent/server/api.php;
    fastcgi_param WINTEREVENT_CONFIG /etc/winterevent/config.php;
    fastcgi_pass unix:/run/php/php-fpm.sock;
    client_max_body_size 64k;
}
