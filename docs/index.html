<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05070f">
  <meta name="color-scheme" content="dark">
  <title>Schnitzeljagd durch Jorvik</title>
  <meta name="description" content="Enchanted Hawks Winterevent – Schnitzeljagd durch Jorvik">
  <link rel="icon" type="image/webp" href="img/logo-mark.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;700;800&family=Oswald:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <!-- Ebene 1: Hintergründe -->
  <div class="bg" id="bg">
    <div class="bg-intro" id="bgIntro"><div class="aur a1"></div><div class="aur a2"></div><div class="aur a3"></div></div>
    <div class="map-stage" id="mapStage"><img id="mapImg" alt="" draggable="false"></div>
    <div class="vignette"></div>
  </div>

  <!-- Ebene 2: WebGL (Schnee + Tresor) -->
  <canvas id="gl" aria-hidden="true"></canvas>

  <!-- Ebene 3: Oberfläche -->
  <div class="ui">
    <div class="map-nodes" id="mapNodes"></div>

    <header class="hud" id="hud">
      <a class="brand" href="https://enchantedhawks.eu" target="_blank" rel="noopener" aria-label="Enchanted Hawks – zur Clubseite">
        <img src="img/logo-mark.webp" alt="" class="brand-logo" width="40" height="40">
        <span class="brand-text">
          <span class="brand-name">Enchanted Hawks</span>
          <span class="brand-tag">Star Stable Online Club</span>
        </span>
      </a>
      <div class="hud-right">
        <div class="team" id="team" hidden><i></i><span id="teamName"></span></div>
        <button class="icon-btn" id="fsBtn" title="Vollbild" aria-label="Vollbild umschalten"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="icon-btn" id="logoutBtn" title="Team wechseln" aria-label="Team wechseln" hidden><svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></button>
      </div>
    </header>

    <main id="screens">
      <section class="screen" id="sIntro"></section>
      <section class="screen" id="sMap"></section>
      <section class="screen" id="sStation"></section>
      <section class="screen" id="sVault"></section>
      <section class="screen" id="sFinal"></section>
    </main>

    <nav class="progress" id="progress" hidden></nav>
  </div>

  <div class="flash" id="flash"></div>
  <div class="toast" id="toast" role="status"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="crest" viewBox="0 0 64 64">
        <path fill="none" stroke="currentColor" stroke-width="2.2" d="M32 3 56 12v20c0 14-10 24-24 29C18 56 8 46 8 32V12z"/>
        <path fill="currentColor" d="M32 20c-3-4-8-6-14-6 4 2 7 5 9 8-4 0-7 1-10 4 5-1 9 0 11 2l4 6 4-6c2-2 6-3 11-2-3-3-6-4-10-4 2-3 5-6 9-8-6 0-11 2-14 6z"/>
        <path fill="currentColor" d="M32 36l-3 9 3 4 3-4z" opacity=".8"/>
      </symbol>
      <symbol id="lock" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10V7a5 5 0 0 1 10 0v3h1.5A1.5 1.5 0 0 1 20 11.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 20.5v-9A1.5 1.5 0 0 1 5.5 10H7zm2 0h6V7a3 3 0 0 0-6 0v3z"/></symbol>
      <symbol id="check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="hawk-shape" viewBox="0 0 64 44"><path fill="currentColor" d="M32 14c-3-5-8-8-14-9C11 4 5 6 0 9c6 0 11 2 15 5-5 0-9 2-12 6 6-2 12-2 16 0l5 6 4 14 4-14 5-6c4-2 10-2 16 0-3-4-7-6-12-6 4-3 9-5 15-5-5-3-11-5-18-4-6 1-11 4-14 9z"/></symbol>
    </defs>
  </svg>

  <script src="vendor/gsap.min.js"></script>
  <script src="data.js"></script>
  <script src="games.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
